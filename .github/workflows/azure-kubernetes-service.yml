
name: Build and deploy an app to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: acseshop1776646759
  CONTAINER_NAME: productservice
  RESOURCE_GROUP: rg-eshop
  CLUSTER_NAME: aks-eshop
  DEPLOYMENT_MANIFEST_PATH: ./product.yml
  DOCKER_PATH: ./DockerfileProducts.acr

jobs:
  buildImage:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build Docker image
        run: |
          docker build \
            --file ${{ env.DOCKER_PATH }} \
            --tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
            .

      - name: Push image to ACR
        run: |
          docker push \
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}
